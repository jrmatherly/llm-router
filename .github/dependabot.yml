version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
    groups:
      docs:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
  - package-ecosystem: docker-compose
    directory: "/docker/claude-apps-gateway"
    schedule:
      interval: weekly
    groups:
      compose:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
