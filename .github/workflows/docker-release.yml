name: 🐳 Docker Release

on:
  workflow_run:
    workflows: ["🚀 Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build, usually a release tag.
        required: true
        default: v4.2.0
      version:
        description: Docker version tag without leading v; defaults to the ref without its v.
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-release-${{ inputs.ref || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/jrmatherly/llm-router

jobs:
  docker:
    name: 🐳 Build and Push
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 📥 Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_branch }}

      - name: 🗂️ Prepare metadata
        id: meta
        shell: bash
        run: |
          ref="${{ inputs.ref || github.event.workflow_run.head_branch }}"
          version="${{ inputs.version }}"
          version="${version:-${ref#v}}"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$version" != "$package_version" ]]; then
            echo "Input version $version does not match package.json version $package_version"
            exit 1
          fi

          if [[ "$ref" == v* && "${ref#v}" != "$version" ]]; then
            echo "Input ref $ref does not match version $version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major_minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - name: 📦 Prepare gateway package
        uses: ./.github/actions/prepare-release-gateway

      - name: ⚙️ Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.major_minor }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔎 Inspect pushed image
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${{ steps.meta.outputs.version }}"
