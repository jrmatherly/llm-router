name: 🚀 Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  model-catalog:
    name: 🗂️ Prepare model catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: 🗂️ Generate model catalog
        run: node scripts/generate-models-json.mjs

      - name: 🔎 Validate generated model catalog
        run: node -e "JSON.parse(require('node:fs').readFileSync('packages/core/models.json', 'utf8'))"

      - name: 📤 Upload model catalog
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-model-catalog
          path: packages/core/models.json
          if-no-files-found: error
          retention-days: 1

  gateway:
    name: 📦 Build gateway
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📦 Prepare gateway package
        uses: ./.github/actions/prepare-release-gateway

      - name: 📤 Upload gateway package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gateway
          path: docker/local-ai-gateway/the-next-ai-ai-gateway-*.tgz
          if-no-files-found: error
          retention-days: 1

  macos:
    name: 🍎 macOS (${{ matrix.display_name }})
    needs: [model-catalog, gateway]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            arch_flag: --arm64
            runner: macos-26
            display_name: Apple Silicon
            release_label: Apple-Silicon
            artifact_name: macos-apple-silicon-arm64
          - arch: x64
            arch_flag: --x64
            runner: macos-26-intel
            display_name: Intel
            release_label: Intel
            artifact_name: macos-intel-x64
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📥 Download gateway package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-gateway
          path: .tmp/gateway-package

      - name: 📦 Install gateway
        shell: bash
        run: npm install --no-save --package-lock=false .tmp/gateway-package/*.tgz

      - name: 📥 Download updated model catalog
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-model-catalog
          path: packages/core

      - name: 🔎 Verify tag version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag v$tag_version does not match package.json version $package_version"
            exit 1
          fi

      - name: 🔐 Prepare signing credentials
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [[ -z "$APPLE_API_KEY_P8" ]]; then
            echo "APPLE_API_KEY_P8 secret is not set; cannot notarize the macOS build."
            exit 1
          fi
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: 🔐 Build signed macOS artifacts
        env:
          CSC_LINK: ${{ secrets.MACOS_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          node build/macos-release-preflight.mjs
          npm run build:assets
          npx electron-builder \
            --mac ${{ matrix.arch_flag }} \
            --publish never \
            -c.directories.output=release-ci \
            -c.mac.artifactName='LLM-Router_${version}-mac-${{ matrix.release_label }}-${arch}.${ext}'

      - name: 📤 Upload macOS release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release-ci/LLM-Router_*-mac-${{ matrix.release_label }}-${{ matrix.arch }}.*
            release-ci/latest-mac.yml
          if-no-files-found: error

  publish-macos:
    name: 🚀 Publish macOS
    needs: macos
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: 📦 Install metadata merge dependencies
        run: npm ci --ignore-scripts

      - name: 📥 Download macOS release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-*
          path: macos-release-artifacts

      - name: 🗂️ Merge macOS update metadata
        run: node build/merge-macos-update-metadata.mjs latest-mac.yml macos-release-artifacts/*/latest-mac.yml

      - name: 🚀 Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

      - name: 📤 Upload macOS release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          assets=(macos-release-artifacts/*/LLM-Router_*-mac-*.*)
          if (( ${#assets[@]} == 0 )); then
            echo "No macOS release assets were found."
            exit 1
          fi

          upload_args=()
          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            case "$name" in
              *Apple-Silicon-arm64.dmg) label="macOS Apple Silicon DMG (arm64)" ;;
              *Apple-Silicon-arm64.zip) label="macOS Apple Silicon ZIP (arm64)" ;;
              *Apple-Silicon-arm64.dmg.blockmap) label="macOS Apple Silicon DMG blockmap (arm64)" ;;
              *Apple-Silicon-arm64.zip.blockmap) label="macOS Apple Silicon ZIP blockmap (arm64)" ;;
              *Intel-x64.dmg) label="macOS Intel DMG (x64)" ;;
              *Intel-x64.zip) label="macOS Intel ZIP (x64)" ;;
              *Intel-x64.dmg.blockmap) label="macOS Intel DMG blockmap (x64)" ;;
              *Intel-x64.zip.blockmap) label="macOS Intel ZIP blockmap (x64)" ;;
              *) label="$name" ;;
            esac
            upload_args+=("${asset}#${label}")
          done
          upload_args+=("latest-mac.yml#macOS update metadata")

          gh release upload "$GITHUB_REF_NAME" "${upload_args[@]}" --clobber

  windows:
    name: 🪟 Windows
    needs: publish-macos
    permissions:
      contents: write
    runs-on: windows-2025
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📥 Download gateway package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-gateway
          path: .tmp/gateway-package

      - name: 📦 Install gateway
        shell: bash
        run: npm install --no-save --package-lock=false .tmp/gateway-package/*.tgz

      - name: 📥 Download updated model catalog
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-model-catalog
          path: packages/core

      - name: 🔎 Verify tag version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag v$tag_version does not match package.json version $package_version"
            exit 1
          fi

      - name: 🚀 Build and publish Windows artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:app:win:release -- --publish always

  linux:
    name: 🐧 Linux
    needs: publish-macos
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📥 Download gateway package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-gateway
          path: .tmp/gateway-package

      - name: 📦 Install gateway
        shell: bash
        run: npm install --no-save --package-lock=false .tmp/gateway-package/*.tgz

      - name: 📥 Download updated model catalog
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-model-catalog
          path: packages/core

      - name: 🔎 Verify tag version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag v$tag_version does not match package.json version $package_version"
            exit 1
          fi

      - name: 🚀 Build and publish Linux artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build:assets
          npx electron-builder --linux AppImage --publish always
