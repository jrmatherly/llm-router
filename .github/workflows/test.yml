name: 🧪 Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gateway:
    name: 📦 Build gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📦 Prepare gateway package
        uses: ./.github/actions/prepare-release-gateway

      - name: 📤 Upload gateway package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-gateway
          path: docker/local-ai-gateway/the-next-ai-ai-gateway-*.tgz
          if-no-files-found: error
          retention-days: 1

  test:
    name: 🧪 Unit and architecture
    needs: gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LLMR_TEST_GATEWAY_ENTRY: ${{ github.workspace }}/node_modules/@the-next-ai/ai-gateway/bin/next-ai-gateway.js
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📥 Download gateway package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-gateway
          path: .tmp/gateway-package

      - name: 📦 Install gateway
        run: npm install --no-save --package-lock=false .tmp/gateway-package/*.tgz

      - name: 🔎 Typecheck
        run: npm run typecheck

      - name: 🧪 Run unit and architecture tests
        run: npm run test

  e2e:
    name: 🎭 End to end
    needs: [test, gateway]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📥 Download gateway package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-gateway
          path: .tmp/gateway-package

      - name: 📦 Install gateway
        run: npm install --no-save --package-lock=false .tmp/gateway-package/*.tgz

      - name: 🎭 Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 🎭 Run end-to-end tests
        run: xvfb-run -a npm run test:e2e

      - name: 📤 Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker-smoke:
    name: 🐳 Docker smoke
    needs: gateway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: 📥 Download gateway package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-gateway
          path: docker/local-ai-gateway

      - name: 🐳 Build the image
        run: docker build -t llm-router:local .

      - name: 🐳 Smoke-test the image
        env:
          LLMR_DOCKER_TEST_SKIP_BUILD: "1"
        run: npm run test:system
