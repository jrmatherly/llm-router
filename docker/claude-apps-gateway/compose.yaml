services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_PASSWORD: pw
      POSTGRES_USER: gw
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gw -d gateway"]
      interval: 2s
      timeout: 3s
      retries: 15
  dex:
    image: ghcr.io/dexidp/dex:v2.44.0
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "${DEX_PORT:-15556}:5556"
    volumes:
      - ./dex.rendered.yaml:/etc/dex/config.yaml:ro
volumes:
  pgdata:
