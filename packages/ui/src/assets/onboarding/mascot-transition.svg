<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480">
  <defs>
    <linearGradient id="provider-head" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="profile-head" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FED7AA"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="enter-head" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#A5F3FC"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <g id="visor">
      <rect x="282" y="410" width="460" height="230" rx="115" fill="#0B1020"/>
      <g filter="url(#glow)">
        <path d="M330 525 H440 Q470 525 500 490 Q530 465 580 465 M440 525 Q470 525 500 560 Q530 585 580 585" stroke="#5EEAD4" stroke-width="24" stroke-linecap="round" fill="none"/>
        <circle cx="626" cy="465" r="44" fill="#5EEAD4"/>
        <circle cx="626" cy="585" r="44" fill="#5EEAD4"/>
      </g>
      <circle cx="640" cy="452" r="13" fill="#0B1020"/>
      <circle cx="640" cy="572" r="13" fill="#0B1020"/>
    </g>

    <g id="provider-mascot">
      <ellipse cx="80" cy="138" rx="40" ry="8" fill="#4C1D95" opacity=".16"/>
      <g transform="translate(80 80) scale(.175) translate(-512 -478)">
        <path d="M512 296 V222" stroke="#5B21B6" stroke-width="30" stroke-linecap="round"/>
        <circle cx="512" cy="206" r="40" fill="#FFB020"/>
        <rect x="190" y="450" width="64" height="190" rx="32" fill="#5B21B6"/>
        <rect x="770" y="450" width="64" height="190" rx="32" fill="#5B21B6"/>
        <rect x="232" y="290" width="560" height="500" rx="160" fill="url(#provider-head)"/>
        <use href="#visor"/>
      </g>
    </g>

    <g id="profile-mascot">
      <ellipse cx="80" cy="138" rx="40" ry="8" fill="#7C2D12" opacity=".14"/>
      <g transform="translate(80 80) scale(.175) translate(-512 -478)">
        <path d="M512 296 V222" stroke="#C2410C" stroke-width="30" stroke-linecap="round"/>
        <circle cx="512" cy="206" r="40" fill="#FFB020"/>
        <rect x="190" y="450" width="64" height="190" rx="32" fill="#C2410C"/>
        <rect x="770" y="450" width="64" height="190" rx="32" fill="#C2410C"/>
        <rect x="232" y="290" width="560" height="500" rx="160" fill="url(#profile-head)"/>
        <use href="#visor"/>
      </g>
    </g>

    <g id="enter-mascot">
      <ellipse cx="80" cy="138" rx="40" ry="8" fill="#164E63" opacity=".14"/>
      <g transform="translate(80 80) scale(.175) translate(-512 -478)">
        <path d="M512 296 V222" stroke="#0E7490" stroke-width="30" stroke-linecap="round"/>
        <circle cx="512" cy="206" r="40" fill="#FFB020"/>
        <rect x="190" y="450" width="64" height="190" rx="32" fill="#0E7490"/>
        <rect x="770" y="450" width="64" height="190" rx="32" fill="#0E7490"/>
        <rect x="232" y="290" width="560" height="500" rx="160" fill="url(#enter-head)"/>
        <use href="#visor"/>
      </g>
    </g>
  </defs>

  <g transform="translate(0 0)"><use href="#provider-mascot" transform="translate(0 6)"/></g>
  <g transform="translate(160 0)"><use href="#provider-mascot" transform="translate(0 1)"/></g>
  <g transform="translate(320 0)"><use href="#provider-mascot" transform="translate(0 -5)"/></g>
  <g transform="translate(480 0)"><use href="#provider-mascot" transform="rotate(-5 80 82) translate(-2 -1)"/></g>
  <g transform="translate(640 0)"><use href="#provider-mascot" transform="rotate(5 80 82) translate(2 -3)"/></g>
  <g transform="translate(800 0)">
    <path d="M25 82H12M30 100H17" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" opacity=".32"/>
    <use href="#provider-mascot" transform="translate(5 0)"/>
  </g>
  <g transform="translate(960 0)"><use href="#provider-mascot" transform="translate(0 2)"/></g>
  <g transform="translate(1120 0)"><use href="#provider-mascot"/></g>

  <g transform="translate(0 160)"><use href="#profile-mascot" transform="translate(0 5)"/></g>
  <g transform="translate(160 160)"><use href="#profile-mascot" transform="translate(0 0)"/></g>
  <g transform="translate(320 160)"><use href="#profile-mascot" transform="rotate(-4 80 84) translate(-2 -2)"/></g>
  <g transform="translate(480 160)"><use href="#profile-mascot" transform="rotate(5 80 84) translate(2 -4)"/></g>
  <g transform="translate(640 160)">
    <path d="M131 63c8-3 13-8 16-15M133 75c9-1 16-5 22-11" stroke="#fb923c" stroke-width="4" stroke-linecap="round" opacity=".35"/>
    <use href="#profile-mascot" transform="translate(-2 -3)"/>
  </g>
  <g transform="translate(800 160)"><use href="#profile-mascot" transform="translate(0 0)"/></g>
  <g transform="translate(960 160)"><use href="#profile-mascot" transform="translate(0 3)"/></g>
  <g transform="translate(1120 160)"><use href="#profile-mascot"/></g>

  <g transform="translate(0 320)"><use href="#enter-mascot" transform="translate(0 7)"/></g>
  <g transform="translate(160 320)"><use href="#enter-mascot" transform="translate(0 1)"/></g>
  <g transform="translate(320 320)"><use href="#enter-mascot" transform="translate(0 -7)"/></g>
  <g transform="translate(480 320)"><use href="#enter-mascot" transform="rotate(-6 80 84) translate(-2 -3)"/></g>
  <g transform="translate(640 320)"><use href="#enter-mascot" transform="rotate(7 80 84) translate(2 -5)"/></g>
  <g transform="translate(800 320)">
    <path d="M42 116H22M50 132H30M116 120h20" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity=".38"/>
    <use href="#enter-mascot" transform="translate(4 -1)"/>
  </g>
  <g transform="translate(960 320)"><use href="#enter-mascot" transform="translate(0 2)"/></g>
  <g transform="translate(1120 320)"><use href="#enter-mascot"/></g>
</svg>
